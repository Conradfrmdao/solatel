<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Solatel</title>
    <link rel="icon" href="favicon.png" />
    <style>
      /* The look outside a match is Conrad's key art's: night navy, the
         sunset's amber, the wordmark's worn white. Saira Condensed for
         anything shouted, Barlow for what is read; both ship with the game
         (assets/fonts, SIL Open Font License). */
      @font-face { font-family: 'Saira Condensed'; font-weight: 600; font-display: swap; src: url(assets/fonts/saira-condensed-600.woff2) format('woff2'); }
      @font-face { font-family: 'Saira Condensed'; font-weight: 800; font-display: swap; src: url(assets/fonts/saira-condensed-800.woff2) format('woff2'); }
      @font-face { font-family: 'Barlow'; font-weight: 400; font-display: swap; src: url(assets/fonts/barlow-400.woff2) format('woff2'); }
      @font-face { font-family: 'Barlow'; font-weight: 500; font-display: swap; src: url(assets/fonts/barlow-500.woff2) format('woff2'); }
      @font-face { font-family: 'Barlow'; font-weight: 600; font-display: swap; src: url(assets/fonts/barlow-600.woff2) format('woff2'); }

      :root {
        --ink: #dfe7f2;
        --dim: #8ea0b8;
        --warn: #ffb648;
        --bad: #ff6b5e;
        --bg: #0b0e13;
        /* outside a match */
        --night: #080b10;
        --deck: #0f141c;
        --well: #0b1017;
        --rule: #243041;
        --chalk: #f3f1ec;
        --amber: #f6a21b;
        --amber-hot: #ffbe45;
        --amber-ink: #1d1203;
        --go: #23a14d;
        --go-hot: #2fc05e;
        --money: #9fe8b4;
        --shout: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
        --read: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
        /* The page is a game, not a document: selecting text with a stray drag
           only ever gets in the way. */
        user-select: none;
        -webkit-user-select: none;
      }

      #solatel-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      /* Only the settings panel takes clicks; everything else must let them
         through to the canvas, or the first click captures nothing. */
      /* The pot, centred at the top: the one place a player's eye already
         goes between fights, and out of the way of the crosshair. Hidden
         until the first snapshot names a figure, so it never shows a
         confident $0.00 that is only "we have not been told yet". */
      #pool {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: baseline;
        gap: 8px;
        padding: 5px 14px;
        border-radius: 999px;
        background: rgba(10, 14, 20, 0.55);
        border: 1px solid rgba(190, 210, 240, 0.14);
      }
      #pool.shown { display: flex; }

      /* The player's own money, under the pot and smaller than it. Two
         figures side by side would invite reading one as the other; the pot
         is the match's and this is theirs. */
      #balance {
        position: absolute;
        top: 86px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: baseline;
        gap: 6px;
        font-size: 12px;
        color: var(--dim);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      #balance.shown { display: flex; }
      #balance .amount { color: var(--ink); }
      #balance.broke .amount { color: var(--bad); }
      #balance .caption { text-transform: uppercase; letter-spacing: 1.1px; }

      /* What this match has been worth. Green because it only ever goes up:
         nobody takes it off a player for dying. */
      #winnings {
        position: absolute;
        top: 108px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 13px;
        color: var(--dim);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      #winnings .amount { color: #9fe8b4; font-weight: 600; }
      #winnings .caption { text-transform: uppercase; letter-spacing: 1.1px; }

      /* The mouse being loose is the difference between playing and
         watching, so it is stated plainly rather than left to the
         diagnostics. */
      #lock-hint {
        background: rgba(10, 14, 20, 0.72);
        border: 1px solid rgba(190, 210, 240, 0.18);
        padding: 7px 15px;
        border-radius: 999px;
        font-size: 14px;
        color: #eaf1fb;
      }

      #stats {
        position: absolute;
        top: 10px;
        left: 12px;
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        color: var(--dim);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        white-space: pre;
      }

      #health {
        position: absolute;
        left: 24px;
        bottom: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      }
      #health .value { min-width: 2.2em; text-align: right; }
      #health .bar {
        width: 220px;
        height: 12px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.45);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        overflow: hidden;
      }
      #health .fill {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #6fd18a, #a9ecb8);
        transform-origin: left center;
        transition: transform 120ms linear;
      }
      #health.hurt { color: var(--bad); }
      #health.hurt .fill { background: linear-gradient(90deg, #d8453b, #f07d68); }
      #health.regen .fill { box-shadow: 0 0 10px rgba(160, 255, 190, 0.8); }

      #weapon {
        position: absolute;
        right: 26px;
        bottom: 22px;
        text-align: right;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      }
      #weapon .gun { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #d7dde6; }
      #weapon .gun .spare { margin-left: 12px; color: var(--dim); }
      #weapon .gun .spare::before { content: 'Q · '; opacity: 0.7; }
      #weapon .ammo { font-size: 22px; color: var(--dim); }
      #weapon .ammo.drawing b { color: var(--dim); }
      #weapon .ammo b { font-size: 34px; color: #eaf1fb; }
      #weapon .ammo.low b { color: #f0c26a; }
      #weapon .ammo.empty b { color: var(--bad); }
      #weapon .reloading { font-size: 20px; letter-spacing: 0.15em; color: #f0c26a; }
      #weapon .reload {
        margin: 6px 0 0 auto;
        width: 140px;
        height: 4px;
        background: rgba(0, 0, 0, 0.45);
      }
      #weapon .reload .fill {
        display: block;
        height: 100%;
        background: #f0c26a;
        transform-origin: left center;
      }
      #weapon .grenades { margin-top: 6px; font-size: 18px; letter-spacing: 0.2em; color: #d7dde6; }

      #zone-warning {
        position: absolute;
        left: 50%;
        top: 22%;
        transform: translateX(-50%);
        padding: 6px 16px;
        border-radius: 4px;
        background: rgba(150, 20, 20, 0.55);
        color: #ffe3de;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.12em;
        animation: zone-pulse 1s ease-in-out infinite;
      }
      @keyframes zone-pulse { 50% { opacity: 0.55; } }

      #hurt-flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(190, 20, 20, 0.55));
      }
      #hurt-flash.flash { animation: hurt 450ms ease-out; }
      /* Blood thrown across the edges of the view when hit (hud.bleed). */
      #blood-screen {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background-size: 100% 100%;
        background-repeat: no-repeat;
      }
      /* Badly hurt: red at the edges, beating. --low is how badly. */
      #low-health {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center, transparent 48%, rgba(120, 0, 0, 0.75));
        transition: opacity 400ms ease;
      }
      #low-health.on { animation: low-beat 1.05s ease-in-out infinite; }
      @keyframes low-beat {
        0%, 100% { opacity: calc(var(--low, 0.5) * 0.75); }
        18% { opacity: var(--low, 0.5); }
        36% { opacity: calc(var(--low, 0.5) * 0.8); }
        52% { opacity: calc(var(--low, 0.5) * 0.95); }
      }
      /* Where a hit came from: an arc round the crosshair on that side. */
      #damage-dirs { position: absolute; inset: 0; pointer-events: none; }
      #damage-dirs .dmg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300px;
        height: 300px;
      }
      #damage-dirs .dmg i {
        position: absolute;
        left: 50%;
        top: 0;
        width: 150px;
        height: 46px;
        transform: translateX(-50%);
        border-top: 9px solid rgba(230, 36, 30, 0.95);
        border-radius: 50% / 100% 100% 0 0;
        filter: drop-shadow(0 0 6px rgba(255, 40, 30, 0.7));
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
      }
      /* A round gone past: thinner and paler than a hit's arc. */
      #damage-dirs .dmg.miss i {
        border-top: 4px solid rgba(255, 236, 200, 0.85);
        filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.8));
        width: 120px;
      }
      @keyframes hurt { from { opacity: 1; } to { opacity: 0; } }
      .kill .cause { margin-left: 6px; font-size: 0.8em; opacity: 0.7; }

      /* ---- the warm-up ------------------------------------------------ */
      #warmup {
        position: absolute;
        left: 50%;
        top: 26%;
        transform: translateX(-50%);
        display: grid;
        justify-items: center;
        gap: 6px;
        padding: 18px 34px 16px;
        border-radius: 14px;
        background: radial-gradient(ellipse at center, rgba(8, 12, 18, 0.72), rgba(8, 12, 18, 0.35));
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }
      #warmup .caption {
        font-size: 13px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--dim);
      }
      #warmup .count {
        font-size: 84px;
        line-height: 1;
        font-weight: 700;
        color: #eaf1fb;
        font-variant-numeric: tabular-nums;
      }
      #warmup .count.beat { animation: beat 420ms ease-out; }
      /* The whole warm-up, not counting yet: somebody's map is still loading. */
      #warmup .count.held { opacity: 0.45; }
      @keyframes beat { from { transform: scale(1.25); color: #9fe8b4; } to { transform: scale(1); } }
      #warmup .about { font-size: 14px; color: #d7dde6; text-transform: lowercase; }
      #warmup .hint { font-size: 12px; color: var(--dim); }
      #go {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translate(-50%, -50%);
        font-size: 96px;
        font-weight: 800;
        letter-spacing: 0.1em;
        color: #9fe8b4;
        text-shadow: 0 0 24px rgba(159, 232, 180, 0.6), 0 3px 10px rgba(0, 0, 0, 0.9);
        opacity: 0;
        pointer-events: none;
      }
      #go.show { animation: go 1100ms ease-out forwards; }
      @keyframes go {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
        15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        70% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.96); }
      }

      /* ---- matchmaking: searching, found, loading ----------------------- */
      #matchmaking {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(5, 7, 11, 0.78);
        backdrop-filter: blur(4px);
        font-family: var(--read);
      }
      /* The card wears the key art across its top, as the menu does. */
      .mm-card {
        width: min(100%, 480px);
        display: grid;
        gap: 10px;
        padding: 0 26px 22px;
        border-radius: 10px;
        overflow: hidden;
        background: var(--deck);
        border: 1px solid var(--rule);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        text-align: center;
      }
      .mm-card::before {
        content: '';
        height: 112px;
        margin: 0 -26px 4px;
        background:
          linear-gradient(0deg, var(--deck), rgba(15, 20, 28, 0) 75%),
          url(assets/menu/hero.webp) left 42% / cover no-repeat;
      }
      .mm-card[data-phase='found'],
      .mm-card[data-phase='loading'] {
        border-color: rgba(246, 162, 27, 0.7);
        box-shadow: 0 0 0 1px rgba(246, 162, 27, 0.25), 0 0 40px rgba(246, 162, 27, 0.15), 0 24px 60px rgba(0, 0, 0, 0.6);
      }
      .mm-head { display: flex; justify-content: center; align-items: baseline; gap: 14px; }
      .mm-title {
        font: 800 30px/1 var(--shout);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--chalk);
      }
      .mm-card[data-phase='found'] .mm-title,
      .mm-card[data-phase='loading'] .mm-title { color: var(--amber-hot); text-shadow: 0 0 22px rgba(246, 162, 27, 0.45); }
      .mm-clock { font: 600 22px/1 var(--shout); color: var(--dim); font-variant-numeric: tabular-nums; }
      .mm-table { font: 600 18px/1.2 var(--shout); letter-spacing: 0.06em; text-transform: uppercase; color: #d7dde6; }
      .mm-table b { text-transform: uppercase; color: var(--chalk); }
      .mm-bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(190, 210, 240, 0.1);
        overflow: hidden;
      }
      .mm-bar .fill {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #c77a0c, var(--amber-hot));
        transform-origin: left center;
        transition: transform 300ms ease;
      }
      .mm-card[data-phase='loading'] .mm-bar .fill { animation: loading 1.1s ease-in-out infinite; }
      @keyframes loading { 0% { opacity: 0.35; } 50% { opacity: 1; } 100% { opacity: 0.35; } }
      .mm-seats { font-size: 12px; color: var(--dim); min-height: 1em; }
      .mm-status { font-size: 14px; color: var(--ink); }
      .mm-fine { font-size: 11px; color: var(--dim); }
      .mm-download { font-size: 11px; color: var(--dim); min-height: 1em; font-variant-numeric: tabular-nums; }
      .mm-card[data-fetching='yes'] .mm-bar .fill { animation: none; }
      .mm-leave {
        justify-self: center;
        margin-top: 6px;
        font: 600 14px/1 var(--shout);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 10px 20px;
        border-radius: 6px;
        color: #ffd9d4;
        background: rgba(255, 107, 94, 0.12);
        border: 1px solid rgba(255, 107, 94, 0.4);
        cursor: pointer;
      }
      .mm-leave:hover { background: rgba(255, 107, 94, 0.22); }
      /* A sweep going round, the universal sign that something is being
         looked for. Only while searching. */
      .mm-radar {
        position: relative;
        justify-self: center;
        width: 64px;
        height: 64px;
        margin-bottom: 4px;
      }
      .mm-radar span {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(246, 162, 27, 0.45);
        animation: ping 2.4s ease-out infinite;
      }
      .mm-radar span:nth-child(2) { animation-delay: 0.8s; }
      .mm-radar span:nth-child(3) { animation-delay: 1.6s; }
      .mm-radar i {
        position: absolute;
        inset: 27px;
        border-radius: 50%;
        background: var(--amber-hot);
        box-shadow: 0 0 14px rgba(246, 162, 27, 0.9);
      }
      @keyframes ping { from { transform: scale(0.2); opacity: 1; } to { transform: scale(1); opacity: 0; } }
      .mm-card[data-phase='found'] .mm-radar span,
      .mm-card[data-phase='loading'] .mm-radar span { animation: none; opacity: 0; }
      .mm-card[data-phase='found'] .mm-radar i { inset: 18px; transition: inset 200ms ease; }

      /* Through a scope: the world in a round eyepiece, black round it, a
         thin shadow ring at its edge, and the reticle over the middle. */
      #scope {
        --eye: 300px;
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 50%,
          transparent calc(var(--eye) - 3px),
          rgba(0, 0, 0, 0.55) calc(var(--eye) - 1px),
          rgba(4, 5, 6, 0.97) calc(var(--eye) + 2px),
          #030304 100%
        );
      }
      #scope::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--eye) * 2);
        height: calc(var(--eye) * 2);
        transform: translate(-50%, -50%);
        border-radius: 50%;
        box-shadow: inset 0 0 calc(var(--eye) * 0.22) rgba(0, 0, 0, 0.65);
      }
      #scope .reticle { position: absolute; inset: 0; width: 100%; height: 100%; }

      #crosshair,
      #hitmarker {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      /* Four short lines round a gap and a dot in it, the way modern
         shooters draw one: black, as Conrad asked, with a thin light edge
         so it still shows against a dark wall. The box itself has no size,
         so its corner is the middle of the screen and every part is placed
         from there. */
      #crosshair {
        width: 0;
        height: 0;
        transform: none;
      }
      #crosshair i,
      #crosshair b {
        position: absolute;
        background: rgba(0, 0, 0, 0.92);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.45);
      }
      #crosshair .n { left: -1px; top: -12px; width: 2px; height: 8px; }
      #crosshair .s { left: -1px; top: 4px; width: 2px; height: 8px; }
      #crosshair .w { left: -12px; top: -1px; width: 8px; height: 2px; }
      #crosshair .e { left: 4px; top: -1px; width: 8px; height: 2px; }
      #crosshair b { left: -1px; top: -1px; width: 2px; height: 2px; }

      /* Four strokes forming an X, drawn only when a shot connects. */
      #hitmarker {
        width: 22px;
        height: 22px;
        opacity: 0;
        transition: opacity 60ms linear;
        background:
          linear-gradient(to bottom right, transparent 44%, var(--bad) 44%, var(--bad) 56%, transparent 56%),
          linear-gradient(to bottom left, transparent 44%, var(--bad) 44%, var(--bad) 56%, transparent 56%);
      }
      #hitmarker.show { opacity: 1; }
      /* A kill: a bigger red X that pops and fades, over the hit marker. */
      #killmarker {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 34px;
        height: 34px;
        opacity: 0;
        transform: translate(-50%, -50%);
        pointer-events: none;
        background:
          linear-gradient(to bottom right, transparent 42%, #e8231d 42%, #e8231d 58%, transparent 58%),
          linear-gradient(to bottom left, transparent 42%, #e8231d 42%, #e8231d 58%, transparent 58%);
        filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.85));
      }
      #killmarker.show { animation: kill-pop 520ms ease-out; }
      #killmarker.head { width: 42px; height: 42px; }
      @keyframes kill-pop {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(1.7) rotate(-8deg); }
        25% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        70% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
      }
      /* A headshot is worth twice a body shot, so it gets its own colour
         rather than the same X twice. */
      #hitmarker.head {
        background:
          linear-gradient(to bottom right, transparent 40%, var(--good, #8fe388) 40%, var(--good, #8fe388) 60%, transparent 60%),
          linear-gradient(to bottom left, transparent 40%, var(--good, #8fe388) 40%, var(--good, #8fe388) 60%, transparent 60%);
        width: 28px;
        height: 28px;
      }

      /* ---- a kill paying ------------------------------------------------ */
      /* Under the crosshair, not on it: the next fight may already be in
         front of the player. Money green, as the counter it flies to is. */
      #payouts {
        position: absolute;
        left: 50%;
        top: calc(50% + 58px);
        width: 0;
        height: 0;
      }
      .payout {
        position: absolute;
        left: 0;
        top: 0;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .payout .amount {
        font-size: 44px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        color: #b8f5c8;
        background: linear-gradient(180deg, #f6fff8 0%, #a9f0bf 48%, #45b872 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 12px rgba(120, 230, 160, 0.55)) drop-shadow(0 3px 3px rgba(0, 0, 0, 0.85));
      }
      .payout .amount.unpaid {
        font-size: 30px;
        letter-spacing: 0.14em;
        background: linear-gradient(180deg, #ffffff 0%, #dfe7f2 60%, #9fb0c6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.85));
      }
      .payout .details {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .payout .tags { display: flex; gap: 6px; }
      .payout .tag {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        padding: 3px 7px 3px 9px;
        border-radius: 4px;
        background: rgba(10, 14, 20, 0.74);
        border: 1px solid rgba(159, 232, 180, 0.35);
        color: #d8ffe2;
      }
      .payout .tag.head { border-color: rgba(255, 196, 92, 0.75); color: #ffd88a; }
      .payout .tag.streak { border-color: rgba(255, 107, 94, 0.75); color: #ffb3aa; }
      .payout .victim {
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--dim);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .payout .victim b { color: var(--ink); font-weight: 600; }
      .payout .spark {
        position: absolute;
        left: 50%;
        width: 14px;
        height: 3px;
        margin: -1.5px 0 0 -7px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(255, 246, 208, 0), #fff6d0 60%, #ffffff);
        box-shadow: 0 0 7px 1px rgba(159, 232, 180, 0.9);
      }

      /* Under the pot, which is the other number that belongs to the match
         rather than to the player. */
      #matchclock {
        position: absolute;
        left: 50%;
        top: 58px;
        transform: translateX(-50%);
        font-size: 19px;
        letter-spacing: 0.06em;
        color: var(--ink);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      }
      #matchclock.urgent { color: var(--bad); }

      /* Bottom right above the weapon, reading upwards from newest. A feed
         that grows downwards moves every line every time one arrives, which
         is the one thing a player glancing at it cannot follow. */
      #killfeed {
        position: absolute;
        right: 14px;
        bottom: 96px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        font-size: 13px;
        pointer-events: none;
      }
      #killfeed .kill {
        padding: 4px 9px;
        border-radius: 6px;
        background: rgba(10, 14, 20, 0.72);
        border: 1px solid rgba(190, 210, 240, 0.12);
        color: var(--dim);
        white-space: nowrap;
      }
      /* Anything the player was part of. Their own kills and deaths are the
         only lines worth breaking a glance for. */
      #killfeed .kill.mine {
        border-color: rgba(255, 107, 94, 0.5);
        color: var(--ink);
      }
      #killfeed .who { color: var(--ink); }
      #killfeed .hs { margin: 0 7px; color: var(--bad); }

      #scoreboard {
        position: absolute;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        padding: 12px 16px;
        border-radius: 10px;
        background: rgba(10, 14, 20, 0.88);
        border: 1px solid rgba(190, 210, 240, 0.18);
        font-size: 13px;
        color: var(--dim);
        min-width: min(88vw, 470px);
      }
      #scoreboard table { width: 100%; border-collapse: collapse; }
      #scoreboard th,
      #scoreboard td {
        padding: 3px 8px;
        text-align: right;
        font-weight: 400;
      }
      #scoreboard th { color: var(--dim); opacity: 0.7; font-size: 11px; }
      #scoreboard .name { text-align: left; color: var(--ink); }
      #scoreboard tr.me .name { color: var(--good, #8fe388); }
      #scoreboard tbody tr.me td { color: var(--ink); }

      #lock-hint {
        position: absolute;
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        padding: 9px 16px;
        border-radius: 999px;
        background: rgba(10, 14, 20, 0.78);
        border: 1px solid rgba(190, 210, 240, 0.16);
        font-size: 13px;
        color: var(--ink);
        white-space: nowrap;
      }

      #banner {
        position: absolute;
        left: 50%;
        top: 16%;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 8px;
        background: rgba(60, 16, 16, 0.86);
        border: 1px solid rgba(255, 107, 94, 0.45);
        color: var(--bad);
        font-size: 14px;
        max-width: min(90vw, 620px);
        text-align: center;
      }

      /* The first thing anybody sees: the key art, wordmark and all, with
         what is loading under it. It is in the page's own styles, so it is
         there before a line of script has run. */
      #boot {
        position: fixed;
        inset: 0;
        isolation: isolate;
        overflow: hidden;
        display: grid;
        align-content: end;
        justify-items: center;
        gap: 14px;
        padding: 0 16px max(7vh, 36px);
        text-align: center;
        background: var(--night);
        transition: opacity 240ms ease;
        font-family: var(--read);
      }
      body.running #boot { opacity: 0; pointer-events: none; }
      /* The art whole, wordmark and all, over a blur of itself that fills
         whatever shape the window is. */
      #boot::before {
        content: '';
        position: absolute;
        inset: -40px;
        z-index: -2;
        background: url(assets/menu/splash.webp) center / cover no-repeat;
        filter: blur(28px) brightness(0.45) saturate(1.1);
      }
      /* The art carries the name, so the heading is the art: its text is
         for whatever cannot see it. It fills the whole window, cropped
         at the edges rather than shrunk inside a blur (Conrad's call). */
      #boot h1 {
        position: absolute;
        inset: 0;
        z-index: -1;
        margin: 0;
        font-size: 0;
        color: transparent;
        background: url(assets/menu/splash.webp) center 30% / cover no-repeat;
      }
      /* What is loading reads over whatever is under it. */
      #boot-status,
      #boot::after { position: relative; }
      #boot { background: linear-gradient(to bottom, rgba(8, 11, 16, 0) 60%, rgba(8, 11, 16, 0.85)), var(--night); }
      #boot-status {
        font: 600 15px/1.3 var(--shout);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--chalk);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        min-height: 1.3em;
      }
      #boot-status.error {
        color: var(--bad);
        max-width: 560px;
        letter-spacing: 0.04em;
        text-transform: none;
        font: 500 15px/1.45 var(--read);
      }
      /* A bar that says something is happening, not how much. */
      #boot::after {
        content: '';
        width: min(280px, 70vw);
        height: 3px;
        border-radius: 2px;
        background:
          linear-gradient(90deg, transparent, var(--amber), transparent) 0 0 / 40% 100% no-repeat,
          rgba(243, 241, 236, 0.14);
        animation: boot-sweep 1.4s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        0% { background-position: -60% 0, 0 0; }
        100% { background-position: 160% 0, 0 0; }
      }
      @media (prefers-reduced-motion: reduce) { #boot::after { animation: none; } }

      /* ---- the menu ---------------------------------------------------
         The screen before the game. There is no world behind it: until a
         match starts the client has not loaded a map, because which map it
         loads is whichever table the player picks. */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        overflow: auto;
        background:
          radial-gradient(90% 60% at 75% -10%, #1b2433 0%, rgba(8, 11, 16, 0) 65%),
          var(--night);
        color: var(--ink);
        font: 400 15px/1.45 var(--read);
      }
      #menu button { font-family: inherit; }
      #menu svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      #menu svg .dot, #menu svg .fill { fill: currentColor; stroke: none; }
      body.in-menu #solatel-canvas { visibility: hidden; }

      /* A life ending: see death.js. The colour drains out of the world, the
         HUD goes, and a card says what happened. */
      #solatel-canvas { transition: filter 0.9s ease-out; }
      body.dying #solatel-canvas { filter: saturate(0.18) contrast(1.12) brightness(0.82); }
      body.dying #hud { visibility: hidden; }
      #death-card {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease-out;
        z-index: 40;
      }
      body.dying #death-card { opacity: 1; }
      #death-card .dc-veil {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 55%, rgba(0, 0, 0, 0) 35%, rgba(90, 6, 6, 0.55) 100%);
        animation: dc-pulse 0.9s ease-out 1;
      }
      @keyframes dc-pulse {
        0% { background-color: rgba(150, 10, 10, 0.45); }
        100% { background-color: rgba(150, 10, 10, 0); }
      }
      #death-card .dc-body {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18%;
        text-align: center;
        color: #f1ece4;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        transform: translateY(14px);
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s;
      }
      body.dying #death-card .dc-body { transform: none; }
      #death-card .dc-title {
        font-size: clamp(28px, 6vw, 56px);
        font-weight: 800;
        letter-spacing: 0.32em;
        color: #e8463c;
      }
      #death-card .dc-by { font-size: clamp(18px, 3vw, 26px); margin-top: 6px; font-weight: 700; }
      #death-card .dc-how { font-size: 15px; opacity: 0.85; margin-top: 4px; letter-spacing: 0.08em; }
      #death-card .dc-money { font-size: 14px; opacity: 0.85; margin-top: 14px; }
      #death-card .dc-skip { font-size: 12px; opacity: 0; margin-top: 18px; transition: opacity 0.4s; letter-spacing: 0.12em; }
      #death-card.dc-skippable .dc-skip { opacity: 0.6; }

      /* ---- the top bar: the wordmark, where to go, who you are, what you
         have ---------------------------------------------------------- */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 3;
        background: linear-gradient(180deg, rgba(6, 8, 12, 0.97), rgba(8, 11, 16, 0.9));
        border-bottom: 1px solid var(--rule);
        backdrop-filter: blur(6px);
      }
      .topbar .bar {
        width: min(100%, 1280px);
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        align-items: center;
        gap: 10px 18px;
        flex-wrap: wrap;
        min-height: 74px;
      }
      .brand {
        display: grid;
        justify-items: center;
        gap: 5px;
        padding: 10px 4px;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .brand img { display: block; height: 30px; width: auto; }
      .brand .motto {
        display: flex;
        align-items: center;
        gap: 9px;
        font: 600 10.5px/1 var(--shout);
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #cfd4db;
      }
      .brand .motto b { color: var(--amber); font-weight: 600; }
      .brand .motto i { width: 16px; height: 1px; background: var(--amber); opacity: 0.85; }
      #menu-tabs { display: flex; flex-wrap: wrap; align-self: stretch; margin-left: 8px; }
      #menu-tabs button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        min-height: 74px;
        font: 600 16px/1 var(--shout);
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #aab4c2;
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        cursor: pointer;
      }
      #menu-tabs button:hover { color: var(--chalk); }
      #menu-tabs button.on {
        color: var(--amber);
        border-bottom-color: var(--amber);
        text-shadow: 0 0 18px rgba(246, 162, 27, 0.45);
      }
      #menu-tabs button:focus-visible,
      #menu button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
      #menu-tabs .gear svg { width: 22px; height: 22px; }
      .me {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .me .avatar {
        width: 40px;
        height: 40px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font: 800 20px/1 var(--shout);
        color: var(--chalk);
        background: radial-gradient(circle at 35% 30%, #2a3546, #121821);
        box-shadow: 0 0 0 2px var(--amber), 0 0 14px rgba(246, 162, 27, 0.35);
      }
      .me .who { display: grid; gap: 2px; min-width: 0; }
      .me .who b { font: 600 16px/1.1 var(--read); color: var(--chalk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16ch; }
      .me .who span { font-size: 12px; color: var(--dim); white-space: nowrap; }
      #purse {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 7px 7px 7px 11px;
        border-radius: 6px;
        color: var(--chalk);
        background: var(--well);
        border: 1px solid var(--rule);
        cursor: pointer;
      }
      #purse svg { color: var(--amber); }
      #purse .amount { font: 600 16px/1 var(--read); font-variant-numeric: tabular-nums; }
      #purse .plus {
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border-radius: 4px;
        font: 800 19px/1 var(--shout);
        color: var(--amber-ink);
        background: linear-gradient(180deg, var(--amber-hot), var(--amber));
      }
      #purse:hover { border-color: rgba(246, 162, 27, 0.6); }
      #purse .tag {
        font: 700 10px/1 var(--shout);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--amber);
        border: 1px solid rgba(246, 162, 27, 0.55);
        border-radius: 3px;
        padding: 3px 4px 2px 5px;
      }

      /* What the player is in the middle of: a line, another tab, no money. */
      #menu-status {
        width: min(calc(100% - 40px), 1240px);
        margin: 16px auto 0;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        color: var(--chalk);
        background: rgba(246, 162, 27, 0.1);
        border: 1px solid rgba(246, 162, 27, 0.35);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      #menu-status b { color: var(--amber-hot); font-weight: 600; text-transform: capitalize; }
      #menu-status .warn { color: var(--bad); }
      #menu-status #leave-queue,
      #menu-status #play-here {
        font: 600 14px/1 var(--shout);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 8px 14px;
        border-radius: 5px;
        color: var(--chalk);
        background: rgba(243, 241, 236, 0.08);
        border: 1px solid rgba(243, 241, 236, 0.22);
        cursor: pointer;
      }
      #menu-status #leave-queue:hover,
      #menu-status #play-here:hover { border-color: var(--amber); }

      /* ---- the screen under it ---------------------------------------- */
      .menu-shell {
        width: min(100%, 1280px);
        margin: 0 auto;
        padding: 20px 20px 56px;
        display: grid;
        gap: 22px;
        align-content: start;
      }
      .pane { display: grid; gap: 18px; align-content: start; min-width: 0; }
      .pane:not([data-pane='play']) {
        padding: 24px;
        border-radius: 10px;
        background: var(--deck);
        border: 1px solid var(--rule);
      }
      .pane h2,
      .pane h3 {
        margin: 0;
        font: 800 26px/1.05 var(--shout);
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--chalk);
        text-wrap: balance;
      }
      .pane h3 { font-size: 19px; font-weight: 600; letter-spacing: 0.08em; }
      .pane h2.section, .pane h3.section { margin-top: 10px; }
      .pane .sub { margin: -10px 0 0; font-size: 15px; color: var(--dim); max-width: 70ch; }
      .pane .label {
        font: 600 13px/1.2 var(--shout);
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.14em;
      }
      .pane .big { font: 800 46px/1 var(--shout); color: var(--money); font-variant-numeric: tabular-nums; }
      .pane .fine { font-size: 13px; color: var(--dim); margin: 0; }

      #menu-result {
        padding: 12px 16px;
        border-radius: 8px;
        background: linear-gradient(90deg, rgba(120, 20, 18, 0.55), rgba(60, 16, 16, 0.25));
        border: 1px solid rgba(255, 107, 94, 0.4);
        font-size: 15px;
        color: var(--chalk);
      }
      #menu-result .who { color: #ff8c80; font-weight: 600; }

      /* "Choose your battle": the key art, the soldier looking out over the
         island, and the line under the title. */
      .hero {
        position: relative;
        min-height: 230px;
        display: grid;
        align-content: center;
        gap: 6px;
        padding: 28px 36px 28px max(34%, 290px);
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--rule);
        background:
          linear-gradient(90deg, rgba(8, 11, 16, 0) 22%, rgba(8, 11, 16, 0.5) 46%, rgba(8, 11, 16, 0.25) 100%),
          linear-gradient(0deg, rgba(8, 11, 16, 0.55), rgba(8, 11, 16, 0) 50%),
          url(assets/menu/hero.webp) left 38% / cover no-repeat,
          var(--deck);
      }
      .hero h1 {
        margin: 0;
        font: 800 clamp(40px, 5.6vw, 68px)/0.95 var(--shout);
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: var(--chalk);
        text-shadow: 0 3px 22px rgba(0, 0, 0, 0.7);
        text-wrap: balance;
      }
      .hero p {
        margin: 0;
        font: 600 clamp(14px, 1.6vw, 19px)/1.25 var(--shout);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #dfe3e8;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }
      @media (max-width: 760px) {
        .hero {
          padding: 120px 18px 20px;
          background:
            linear-gradient(0deg, rgba(8, 11, 16, 0.92), rgba(8, 11, 16, 0) 75%),
            url(assets/menu/hero.webp) left 30% / cover no-repeat,
            var(--deck);
        }
      }

      /* A map is a picture of it, its name and two lines about the ground. */
      #menu-maps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }
      .map {
        position: relative;
        display: grid;
        align-content: end;
        justify-items: start;
        gap: 6px;
        min-height: 250px;
        padding: 18px 20px;
        border-radius: 8px;
        overflow: hidden;
        text-align: left;
        color: var(--chalk);
        background: var(--deck);
        border: 1px solid var(--rule);
        cursor: pointer;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .map > * { position: relative; }
      .map .art {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #1a2433, #0d1219) center / cover no-repeat;
        transition: transform 0.5s ease;
      }
      .map .art::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(5, 7, 10, 0) 30%, rgba(5, 7, 10, 0.55) 62%, rgba(5, 7, 10, 0.92) 100%);
      }
      .map[data-map='arena'] .art { background-image: url(assets/menu/map-arena.webp); }
      .map[data-map='yard'] .art { background-image: url(assets/menu/map-yard.webp); }
      .map[data-map='facility'] .art { background-image: url(assets/menu/map-facility.webp); }
      .map:hover .art { transform: scale(1.035); }
      .map:hover { border-color: rgba(246, 162, 27, 0.5); }
      .map.on {
        border: 2px solid var(--amber);
        box-shadow: 0 0 0 1px rgba(246, 162, 27, 0.3), 0 0 30px rgba(246, 162, 27, 0.18);
      }
      .map .badge {
        position: absolute;
        top: 12px;
        left: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 4px;
        font: 600 13px/1 var(--shout);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--amber-hot);
        background: rgba(8, 10, 14, 0.85);
        border: 1px solid rgba(246, 162, 27, 0.5);
      }
      .map .badge svg { width: 15px; height: 15px; color: var(--amber); }
      .map .name {
        font: 800 42px/0.92 var(--shout);
        letter-spacing: 0.02em;
        text-transform: uppercase;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
      }
      .map .blurb { font-size: 15px; line-height: 1.35; color: #dde2e8; }
      .map .seats {
        position: absolute;
        right: 18px;
        bottom: 18px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 600 14px/1 var(--shout);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .map .busy { font-size: 12px; color: #b5bfcc; font-variant-numeric: tabular-nums; }

      /* The gun a life is played with: a picture of each, what it is for,
         and bars for what it does, then the optics it can carry. */
      .gear-box kbd {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 3px;
        font: 600 12px/1.4 var(--shout);
        background: var(--well);
        border: 1px solid #2c394b;
      }
      #menu-guns {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
      }
      .gun {
        display: grid;
        gap: 8px;
        align-content: start;
        padding: 12px 14px 14px;
        border-radius: 8px;
        text-align: left;
        color: var(--chalk);
        background: var(--well);
        border: 1px solid #2c394b;
        cursor: pointer;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .gun:hover { border-color: rgba(246, 162, 27, 0.55); }
      .gun.on {
        border: 2px solid var(--amber);
        background: linear-gradient(180deg, rgba(246, 162, 27, 0.16), rgba(246, 162, 27, 0.03));
        box-shadow: 0 0 24px rgba(246, 162, 27, 0.14);
      }
      .gun .art {
        display: block;
        width: 100%;
        aspect-ratio: 480 / 170;
        object-fit: contain;
        background: radial-gradient(ellipse at 50% 60%, rgba(246, 162, 27, 0.1), transparent 70%);
      }
      .gun .name { font: 800 24px/1 var(--shout); letter-spacing: 0.03em; text-transform: uppercase; }
      .gun.on .name { color: var(--amber-hot); }
      .gun .blurb { font-size: 13px; line-height: 1.35; color: #c3ccd8; min-height: 2.7em; }
      .gun .stats { display: grid; gap: 5px; }
      .gun .stat {
        display: grid;
        grid-template-columns: 70px 1fr auto;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--dim);
      }
      .gun .stat .label { text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
      .gun .stat .track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .gun .stat .fill { display: block; height: 100%; background: linear-gradient(90deg, #c47c12, var(--amber-hot)); }
      .gun .stat .value { color: #d7dde6; font-variant-numeric: tabular-nums; white-space: nowrap; }
      #menu-optics { display: flex; flex-wrap: wrap; gap: 10px; }
      .optic {
        display: grid;
        gap: 2px;
        padding: 9px 16px;
        border-radius: 6px;
        text-align: left;
        color: var(--chalk);
        background: var(--well);
        border: 1px solid #2c394b;
        cursor: pointer;
      }
      .optic b { font: 800 18px/1 var(--shout); letter-spacing: 0.04em; text-transform: uppercase; }
      .optic span { font-size: 12px; color: var(--dim); }
      .optic:hover { border-color: rgba(246, 162, 27, 0.55); }
      .optic.on { border: 2px solid var(--amber); }
      .optic.on b { color: var(--amber-hot); }
      #menu-carrying { color: #d7dde6; }
      /* How a player is dressed: the soldier in each skin. */
      #menu-skins {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
        gap: 10px;
      }
      .skin {
        display: grid;
        gap: 4px;
        align-content: start;
        padding: 8px 8px 10px;
        border-radius: 8px;
        text-align: left;
        color: var(--chalk);
        background: var(--well);
        border: 1px solid #2c394b;
        cursor: pointer;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .skin:hover { border-color: rgba(246, 162, 27, 0.55); }
      .skin.on {
        border: 2px solid var(--amber);
        background: linear-gradient(180deg, rgba(246, 162, 27, 0.16), rgba(246, 162, 27, 0.03));
      }
      .skin .art {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: contain;
        background: radial-gradient(ellipse at 50% 55%, rgba(246, 162, 27, 0.12), transparent 70%);
      }
      .skin .name { font: 800 16px/1 var(--shout); letter-spacing: 0.04em; text-transform: uppercase; }
      .skin.on .name { color: var(--amber-hot); }
      .skin .blurb { font-size: 11px; line-height: 1.3; color: #b5bfcc; }

      /* ---- the play screen: one window, no scrolling ------------------
         The maps first; picking one opens the gear and the stakes under
         them, all in the window at once, the way a console shooter's lobby
         is - and picking a stake is pressing play. The other panes are
         pages, and scroll. */
      #menu { display: flex; flex-direction: column; }
      #menu > * { flex: none; }
      #menu[data-pane='play'] > .menu-shell {
        flex: 1 1 0;
        min-height: 560px;
        width: min(100%, 1640px);
        padding: 14px 20px 16px;
        grid-template-rows: minmax(0, 1fr);
        align-content: stretch;
      }
      .pane[data-pane='play'] { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
      .battle { flex: 1 1 0; display: grid; gap: 14px; min-height: 0; }
      .battle[data-phase='pick'] { grid-template-rows: auto minmax(0, 1fr) auto; }
      .battle[data-phase='gear'] { grid-template-rows: auto minmax(0, 1fr); }
      .battle[data-phase='gear'] > .hero,
      .battle[data-phase='gear'] > .activity,
      .battle[data-phase='pick'] > .gear { display: none; }
      .battle > .hero { min-height: 0; padding-top: 22px; padding-bottom: 22px; }
      .battle > .hero h1 { font-size: clamp(34px, 4.4vw, 60px); }

      /* The maps: as large as the window allows while they are the choice,
         a strip once one is picked, the picked one saying how far its
         download has come. */
      .battle #menu-maps { grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 0; }
      .battle[data-phase='pick'] .map { min-height: 0; height: 100%; }
      .battle[data-phase='gear'] #menu-maps { grid-auto-rows: clamp(96px, 15vh, 150px); }
      .battle[data-phase='gear'] .map { min-height: 0; padding: 12px 16px; gap: 3px; }
      .battle[data-phase='gear'] .map .name { font-size: clamp(26px, 2.6vw, 36px); }
      .battle[data-phase='gear'] .map .blurb,
      .battle[data-phase='gear'] .map .badge { display: none; }
      .battle[data-phase='gear'] .map:not(.on) { opacity: 0.7; }
      .battle[data-phase='gear'] .map:not(.on):hover { opacity: 1; }
      .battle[data-phase='gear'] .map .seats { top: 12px; bottom: auto; }
      .map .fetch { display: grid; gap: 4px; width: min(100%, 360px); margin-top: 3px; }
      .map .fetch .bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
      .map .fetch i {
        display: block;
        width: 4%;
        height: 100%;
        background: linear-gradient(90deg, #c47c12, var(--amber-hot));
        transition: width 0.3s ease;
      }
      .map .fetch .what { font: 600 12px/1.2 var(--shout); letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber-hot); }
      .map .fetch.done i { background: var(--money); }
      .map .fetch.done .what { color: var(--money); }

      /* The gear: the gun and its sight, the outfit, the stake. */
      .gear {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(250px, 0.8fr);
        gap: 14px;
        min-height: 0;
      }
      .gear-box {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
        min-height: 0;
        padding: 14px 16px;
        border-radius: 10px;
        background: var(--deck);
        border: 1px solid var(--rule);
        overflow: auto;
      }
      .pane .gear-box h3 {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 4px 10px;
        font: 800 20px/1 var(--shout);
        letter-spacing: 0.06em;
      }
      .gear-box .note { font: 400 13px/1.35 var(--read); letter-spacing: 0; text-transform: none; color: var(--dim); }
      .gear-box p.note { margin: -4px 0 0; }
      .gear #menu-guns { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .gear .gun { gap: 4px; padding: 8px 10px 10px; }
      .gear .gun .art { aspect-ratio: auto; height: clamp(40px, 9vh, 104px); }
      .gear .gun .name { font-size: 19px; }
      .gear .gun .blurb { display: none; }
      .gear .gun .stats { gap: 2px; }
      .gear .gun .stat { grid-template-columns: 62px 1fr auto; gap: 6px; font-size: 11px; }
      .gear #menu-optics { gap: 8px; }
      .gear .optic { padding: 7px 12px; }
      .gear .optic b { font-size: 16px; }
      .gear #menu-skins { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-content: start; }
      .gear .skin { gap: 2px; padding: 4px 4px 6px; }
      .gear .skin .name { font-size: 11px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gear #menu-tables { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .gear .table {
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-areas: 'stake pays go' 'stake busy go';
        column-gap: 14px;
        padding: 12px 12px 12px 16px;
      }
      .gear .table .stake { grid-area: stake; font-size: 36px; }
      .gear .table .pays { grid-area: pays; align-self: end; }
      .gear .table .busy { grid-area: busy; align-self: start; margin: 0; white-space: nowrap; }
      .gear .table .go {
        grid-area: go;
        padding: 13px 22px;
        border-radius: 6px;
        font: 800 22px/1 var(--shout);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--amber-ink);
        background: linear-gradient(180deg, var(--amber-hot), var(--amber) 60%, #e08a0b);
        box-shadow: 0 8px 20px rgba(246, 162, 27, 0.22), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
      }
      .gear .table:hover:not(:disabled) .go { filter: brightness(1.08); }
      .gear .table:disabled { cursor: default; opacity: 0.6; }
      .gear .table:disabled .go { box-shadow: none; }
      .gear .table.on::after { display: none; }
      .gear #menu-carrying { margin-top: auto; }

      /* What has been won lately, under the maps while they are the choice. */
      .battle > .activity { padding: 12px 18px; gap: 8px; }
      .battle > .activity ul.feed { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 18px; }
      .battle > .activity ul.feed li:nth-child(n + 4) { display: none; }

      /* A tall window has room for the outfits at a size worth looking at. */
      @media (min-height: 860px) {
        .gear #menu-skins { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
        .gear .skin .name { font-size: 13px; }
      }
      /* A short window - a laptop's - keeps the essentials. */
      @media (max-height: 780px) {
        .gear .gun .stat:nth-child(n + 3) { display: none; }
        .gear .gun .art { height: 40px; }
        .battle > .hero { padding-top: 14px; padding-bottom: 14px; }
        .gear #menu-tables { gap: 7px; }
        .gear .table { padding: 7px 8px 7px 14px; }
        .gear .table .stake { font-size: 30px; }
        .gear .table .go { padding: 10px 18px; font-size: 20px; }
        .gear-box { padding: 12px 14px; gap: 8px; }
      }
      /* A narrow one stacks the gear and scrolls. */
      @media (max-width: 1000px) {
        #menu[data-pane='play'] > .menu-shell { flex: none; }
        .gear { grid-template-columns: minmax(0, 1fr); }
        .battle #menu-maps { grid-template-columns: minmax(0, 1fr); }
        .battle[data-phase='pick'] .map { min-height: 200px; }
        .battle > .activity ul.feed { grid-template-columns: minmax(0, 1fr); }
      }

      /* The entry fee, and what has been won lately. */
      .activity {
        display: grid;
        gap: 14px;
        align-content: start;
        padding: 20px 22px;
        border-radius: 10px;
        background: var(--deck);
        border: 1px solid var(--rule);
        min-width: 0;
      }
      #menu-tables {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }
      .table {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        column-gap: 10px;
        row-gap: 3px;
        padding: 14px 16px;
        border-radius: 6px;
        text-align: left;
        color: var(--chalk);
        background: var(--well);
        border: 1px solid #2c394b;
        cursor: pointer;
      }
      .table .coin { grid-row: 1 / 3; color: #aab4c2; }
      .table .coin svg { width: 30px; height: 30px; }
      .table .stake { font: 800 32px/1 var(--shout); font-variant-numeric: tabular-nums; }
      .table .pays { font-size: 13px; color: var(--money); }
      .table .busy { grid-column: 1 / -1; font-size: 12px; color: var(--dim); margin-top: 4px; }
      .table:hover { border-color: rgba(246, 162, 27, 0.55); }
      .table.on {
        border: 2px solid var(--amber);
        background: linear-gradient(180deg, rgba(246, 162, 27, 0.2), rgba(246, 162, 27, 0.05));
      }
      .table.on .stake { color: var(--amber-hot); }
      .table.on .coin { color: var(--amber); }
      .table.on::after {
        content: '';
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 13px;
        height: 7px;
        border-left: 3px solid var(--amber);
        border-bottom: 3px solid var(--amber);
        transform: rotate(-45deg);
      }
      .activity h3,
      .pane .activity h3 { display: flex; align-items: center; gap: 9px; font-size: 16px; letter-spacing: 0.12em; }
      .activity h3 svg { color: var(--amber); }
      ul.feed, ol.leaders { list-style: none; margin: 0; padding: 0; display: grid; }
      ul.feed li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 7px;
        padding: 9px 2px;
        border-bottom: 1px solid #1b2430;
        font-size: 14.5px;
      }
      ul.feed li:last-child { border-bottom: 0; }
      ul.feed .mark { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #18202b; color: var(--amber); }
      ul.feed .mark svg { width: 15px; height: 15px; }
      ul.feed .name { color: var(--chalk); font-weight: 600; }
      ul.feed .won { color: var(--money); font-weight: 600; font-variant-numeric: tabular-nums; }
      ul.feed .where { text-transform: capitalize; color: var(--ink); }
      ul.feed .when { margin-left: auto; font-size: 12.5px; color: var(--dim); }
      ul.feed .dim, ol.leaders .dim { color: var(--dim); }
      ol.leaders li {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 6px 16px;
        padding: 11px 6px;
        border-bottom: 1px solid #1b2430;
      }
      ol.leaders li.dim { display: block; }
      ol.leaders .rank {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font: 800 18px/1 var(--shout);
        color: var(--chalk);
        background: #18202b;
        border: 1px solid var(--rule);
      }
      ol.leaders .top1 .rank { color: var(--amber-ink); background: linear-gradient(180deg, #ffd27a, var(--amber)); border: 0; }
      ol.leaders .top2 .rank { color: #11161d; background: linear-gradient(180deg, #eef1f5, #a9b3bf); border: 0; }
      ol.leaders .top3 .rank { color: #1c1007; background: linear-gradient(180deg, #e8a76a, #a8622c); border: 0; }
      ol.leaders .name { font-size: 16px; color: var(--chalk); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      ol.leaders .kills { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
      ol.leaders .won { font: 800 22px/1 var(--shout); color: var(--money); font-variant-numeric: tabular-nums; }
      @media (max-width: 560px) {
        ol.leaders li { grid-template-columns: 44px minmax(0, 1fr) auto; }
        ol.leaders .kills { grid-column: 2; grid-row: 2; }
      }
      @media (max-width: 760px) {
        .topbar .bar { padding: 8px 16px; gap: 6px 12px; }
        #menu-tabs { order: 3; width: 100%; margin: 0; overflow-x: auto; flex-wrap: nowrap; }
        #menu-tabs button { min-height: 46px; padding: 0 10px; }
        .menu-shell { padding: 16px 16px 48px; }
      }

      /* The rules, stated before anybody pays. */
      .rules {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 8px;
      }
      .rules > div {
        display: grid;
        gap: 4px;
        align-content: start;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(190, 210, 240, 0.04);
        border: 1px solid rgba(190, 210, 240, 0.1);
        font-size: 12px;
        color: var(--dim);
        line-height: 1.45;
      }
      .rules b { color: var(--ink); font-size: 13px; }

      .keys { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--dim); }
      .keys span { display: inline-flex; align-items: center; gap: 4px; }
      kbd {
        font: inherit;
        font-size: 11px;
        color: var(--ink);
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(190, 210, 240, 0.08);
        border: 1px solid rgba(190, 210, 240, 0.22);
        border-bottom-width: 2px;
      }

      /* Mouse against touchpad, said plainly: a touchpad player is at a real
         disadvantage in a game that pays for aim. */
      .devices {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px;
      }
      .device {
        display: grid;
        gap: 5px;
        align-content: start;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(190, 210, 240, 0.12);
        background: rgba(190, 210, 240, 0.04);
        font-size: 12px;
        line-height: 1.45;
        color: var(--dim);
      }
      .device.best { border-color: rgba(159, 232, 180, 0.4); background: rgba(159, 232, 180, 0.06); }
      .device > b { color: var(--ink); font-size: 13px; }
      .device em {
        font-style: normal;
        font-size: 10px;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 4px;
        color: #06210f;
        background: #9fe8b4;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .device .pro::before { content: '+ '; color: #9fe8b4; }
      .device .con::before { content: '\2212  '; color: var(--bad); }
      .device .con b { color: var(--ink); }

      /* Nothing here works on a phone, and it is kinder to say so. */
      .needs-keyboard {
        display: none;
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        color: #ffd28a;
        background: rgba(255, 196, 80, 0.08);
        border: 1px solid rgba(255, 196, 80, 0.3);
      }
      @media (hover: none) and (pointer: coarse) {
        .needs-keyboard { display: block; }
      }

      /* Form controls in the menu's colours rather than the browser's. */
      #menu input[type='range'],
      #menu input[type='checkbox'] { accent-color: #9fe8b4; }
      #menu-profile input[type='text'] {
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(190, 210, 240, 0.2);
        border-radius: 6px;
        padding: 6px 8px;
      }
      #menu-status:empty { display: none; }

      /* ---- the wallet and the account -------------------------------- */
      #wallet-note { font-size: 13px; color: var(--dim); min-height: 1.3em; }
      #wallet-note.warn { color: var(--bad); }
      #wallet-note a { color: #9fe8b4; }
      #wallet-on { display: grid; gap: 14px; }
      #wallet-network {
        font-size: 12px;
        color: var(--dim);
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255, 196, 80, 0.08);
        border: 1px solid rgba(255, 196, 80, 0.3);
      }
      #wallet-network b { color: #ffc450; text-transform: uppercase; letter-spacing: 1px; }
      .wallet-block {
        display: grid;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid rgba(190, 210, 240, 0.1);
        min-width: 0;
      }
      .wallet-block .field {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .wallet-block .field > span { color: var(--dim); }
      .wallet-block code {
        font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
        color: var(--ink);
        background: rgba(190, 210, 240, 0.06);
        border-radius: 6px;
        padding: 6px 8px;
        overflow-wrap: anywhere;
        min-width: 0;
      }
      .wallet-block code.block { display: block; }
      .wallet-block code.secret { color: var(--dim); font-style: italic; }
      .wallet-block .fine { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.5; }
      .wallet-block .fine b { color: var(--ink); }
      .wallet-block a { color: #9fe8b4; }
      .wallet-block button {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--ink);
        background: rgba(190, 210, 240, 0.08);
        border: 1px solid rgba(190, 210, 240, 0.2);
        cursor: pointer;
      }
      .wallet-block button:hover { border-color: rgba(159, 232, 180, 0.5); }
      .wallet-block button[type='submit'] {
        justify-self: start;
        font-size: 14px;
        padding: 10px 20px;
        color: #06210f;
        background: #9fe8b4;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .wallet-block button:disabled,
      .wallet-block input:disabled { opacity: 0.45; cursor: not-allowed; }
      #withdraw-form { display: grid; gap: 10px; }
      #withdraw-form label,
      form.inline {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--dim);
      }
      #withdraw-form label { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; }
      .wallet-block input {
        font: 13px ui-monospace, SFMono-Regular, Consolas, monospace;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(190, 210, 240, 0.2);
        border-radius: 6px;
        padding: 8px 10px;
        min-width: 0;
      }
      form.inline input { flex: 1 1 240px; }
      .with-unit { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .with-unit input { flex: 1; }
      /* A Solana Pay code, on white: a scanner wants the quiet zone. */
      .qr {
        justify-self: start;
        width: 148px;
        height: 148px;
        padding: 6px;
        border-radius: 8px;
        background: #ffffff;
      }
      .qr svg { display: block; width: 100%; height: 100%; }
      #solana-wallets { display: flex; flex-wrap: wrap; gap: 8px; }
      .assets { display: flex; gap: 6px; }
      .assets button.on { color: #06210f; background: #9fe8b4; border-color: rgba(255, 255, 255, 0.3); }
      #solana-connected { display: grid; gap: 8px; }
      .wallet-choice {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .wallet-choice img { width: 20px; height: 20px; border-radius: 4px; }
      @media (max-width: 560px) {
        .qr { justify-self: center; }
      }
      #wallet-history { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
      #wallet-history .in b { color: #9fe8b4; }
      #wallet-history .out.returned b { color: var(--bad); }
      #wallet-history .dim { color: var(--dim); }
      @media (max-width: 560px) {
        .wallet-block .field,
        #withdraw-form label { grid-template-columns: minmax(0, 1fr) auto; }
        .wallet-block .field > span,
        #withdraw-form label { grid-column: 1 / -1; }
      }

      /* ---- fair play: the payout record, the rules, the credits -------- */
      .notice {
        font-size: 12px;
        line-height: 1.5;
        color: var(--dim);
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255, 196, 80, 0.08);
        border: 1px solid rgba(255, 196, 80, 0.3);
      }
      .notice b { color: #ffc450; text-transform: uppercase; letter-spacing: 1px; }
      .figures {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 8px;
      }
      .figures > .dim { font-size: 13px; color: var(--dim); }
      .figure {
        display: grid;
        gap: 3px;
        align-content: start;
        padding: 12px 14px;
        border-radius: 8px;
        background: rgba(159, 232, 180, 0.05);
        border: 1px solid rgba(159, 232, 180, 0.22);
        min-width: 0;
      }
      .figure b {
        font-size: 24px;
        font-weight: 600;
        color: #9fe8b4;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .figure .caption {
        font-size: 11px;
        color: var(--ink);
        text-transform: uppercase;
        letter-spacing: 1.2px;
      }
      .figure .detail { font-size: 12px; color: var(--dim); }
      .rules.wide { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      @media (max-width: 560px) {
        .figures { grid-template-columns: 1fr 1fr; }
        .figure { padding: 10px; }
        .figure b { font-size: 19px; }
      }
      #proof-asof { margin: 0; font-size: 12px; color: var(--dim); }
      ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
      ul.plain .dim, ul.plain .dim a { color: var(--dim); }
      #proof-withdrawals b { color: #9fe8b4; }
      #proof-withdrawals a { color: #9fe8b4; }
      ul.honest li,
      ul.credits li {
        font-size: 12px;
        line-height: 1.5;
        color: var(--dim);
        padding-left: 14px;
        position: relative;
      }
      ul.honest li::before,
      ul.credits li::before { content: '\2022'; position: absolute; left: 2px; color: rgba(190, 210, 240, 0.4); }
      ul.credits a { color: var(--ink); }

      /* The settings live in the menu now, so they are a plain block rather
         than a panel floating over the weapon. */
      #menu-profile label,
      #settings label {
        display: grid;
        grid-template-columns: 120px 140px 1fr;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--dim);
        padding: 4px 0;
      }
      #settings label.check input { width: auto; justify-self: start; }
      #settings select {
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(190, 210, 240, 0.2);
        border-radius: 6px;
        padding: 5px 8px;
      }
      #settings .settings-note { margin: 2px 0 0; font-size: 12px; line-height: 1.5; color: var(--dim); max-width: 60ch; }
      #menu-profile input[type='text'] { width: 140px; }

      .hidden { display: none !important; }

      /* Anything that describes a match, while the player is not in one. */
      .out-of-match { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="solatel-canvas"></canvas>
    <div id="hud"></div>
    <div id="menu" class="hidden"></div>
    <div id="matchmaking" class="hidden"></div>

    <div id="boot">
      <h1>SOLATEL</h1>
      <div id="boot-status">starting&hellip;</div>
    </div>

    <script type="module" src="solatel.js"></script>
  </body>
</html>
