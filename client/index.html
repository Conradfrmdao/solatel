<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Solatel</title>
    <link rel="icon" href="favicon.png" />
    <style>
      :root {
        --ink: #dfe7f2;
        --dim: #8ea0b8;
        --warn: #ffb648;
        --bad: #ff6b5e;
        --bg: #0b0e13;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
        /* The page is a game, not a document: selecting text with a stray drag
           only ever gets in the way. */
        user-select: none;
        -webkit-user-select: none;
      }

      #solatel-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      /* Only the settings panel takes clicks; everything else must let them
         through to the canvas, or the first click captures nothing. */
      /* The pot, centred at the top: the one place a player's eye already
         goes between fights, and out of the way of the crosshair. Hidden
         until the first snapshot names a figure, so it never shows a
         confident $0.00 that is only "we have not been told yet". */
      #pool {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: baseline;
        gap: 8px;
        padding: 5px 14px;
        border-radius: 999px;
        background: rgba(10, 14, 20, 0.55);
        border: 1px solid rgba(190, 210, 240, 0.14);
      }
      #pool.shown { display: flex; }

      /* The player's own money, under the pot and smaller than it. Two
         figures side by side would invite reading one as the other; the pot
         is the match's and this is theirs. */
      #balance {
        position: absolute;
        top: 86px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: baseline;
        gap: 6px;
        font-size: 12px;
        color: var(--dim);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      #balance.shown { display: flex; }
      #balance .amount { color: var(--ink); }
      #balance.broke .amount { color: var(--bad); }
      #balance .caption { text-transform: uppercase; letter-spacing: 1.1px; }

      /* What this match has been worth. Green because it only ever goes up:
         nobody takes it off a player for dying. */
      #winnings {
        position: absolute;
        top: 108px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 13px;
        color: var(--dim);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      #winnings .amount { color: #9fe8b4; font-weight: 600; }
      #winnings .caption { text-transform: uppercase; letter-spacing: 1.1px; }

      /* The mouse being loose is the difference between playing and
         watching, so it is stated plainly rather than left to the
         diagnostics. */
      #lock-hint {
        background: rgba(10, 14, 20, 0.72);
        border: 1px solid rgba(190, 210, 240, 0.18);
        padding: 7px 15px;
        border-radius: 999px;
        font-size: 14px;
        color: #eaf1fb;
      }

      #stats {
        position: absolute;
        top: 10px;
        left: 12px;
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        color: var(--dim);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        white-space: pre;
      }

      #health {
        position: absolute;
        left: 24px;
        bottom: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      }
      #health .value { min-width: 2.2em; text-align: right; }
      #health .bar {
        width: 220px;
        height: 12px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.45);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        overflow: hidden;
      }
      #health .fill {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #6fd18a, #a9ecb8);
        transform-origin: left center;
        transition: transform 120ms linear;
      }
      #health.hurt { color: var(--bad); }
      #health.hurt .fill { background: linear-gradient(90deg, #d8453b, #f07d68); }
      #health.regen .fill { box-shadow: 0 0 10px rgba(160, 255, 190, 0.8); }

      #weapon {
        position: absolute;
        right: 26px;
        bottom: 22px;
        text-align: right;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      }
      #weapon .ammo { font-size: 22px; color: var(--dim); }
      #weapon .ammo b { font-size: 34px; color: #eaf1fb; }
      #weapon .ammo.low b { color: #f0c26a; }
      #weapon .ammo.empty b { color: var(--bad); }
      #weapon .reloading { font-size: 20px; letter-spacing: 0.15em; color: #f0c26a; }
      #weapon .reload {
        margin: 6px 0 0 auto;
        width: 140px;
        height: 4px;
        background: rgba(0, 0, 0, 0.45);
      }
      #weapon .reload .fill {
        display: block;
        height: 100%;
        background: #f0c26a;
        transform-origin: left center;
      }
      #weapon .grenades { margin-top: 6px; font-size: 18px; letter-spacing: 0.2em; color: #d7dde6; }

      #zone-warning {
        position: absolute;
        left: 50%;
        top: 22%;
        transform: translateX(-50%);
        padding: 6px 16px;
        border-radius: 4px;
        background: rgba(150, 20, 20, 0.55);
        color: #ffe3de;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.12em;
        animation: zone-pulse 1s ease-in-out infinite;
      }
      @keyframes zone-pulse { 50% { opacity: 0.55; } }

      #hurt-flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(190, 20, 20, 0.55));
      }
      #hurt-flash.flash { animation: hurt 450ms ease-out; }
      /* Where a hit came from: an arc round the crosshair on that side. */
      #damage-dirs { position: absolute; inset: 0; pointer-events: none; }
      #damage-dirs .dmg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300px;
        height: 300px;
      }
      #damage-dirs .dmg i {
        position: absolute;
        left: 50%;
        top: 0;
        width: 150px;
        height: 46px;
        transform: translateX(-50%);
        border-top: 9px solid rgba(230, 36, 30, 0.95);
        border-radius: 50% / 100% 100% 0 0;
        filter: drop-shadow(0 0 6px rgba(255, 40, 30, 0.7));
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
      }
      @keyframes hurt { from { opacity: 1; } to { opacity: 0; } }
      .kill .cause { margin-left: 6px; font-size: 0.8em; opacity: 0.7; }

      /* ---- the warm-up ------------------------------------------------ */
      #warmup {
        position: absolute;
        left: 50%;
        top: 26%;
        transform: translateX(-50%);
        display: grid;
        justify-items: center;
        gap: 6px;
        padding: 18px 34px 16px;
        border-radius: 14px;
        background: radial-gradient(ellipse at center, rgba(8, 12, 18, 0.72), rgba(8, 12, 18, 0.35));
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }
      #warmup .caption {
        font-size: 13px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--dim);
      }
      #warmup .count {
        font-size: 84px;
        line-height: 1;
        font-weight: 700;
        color: #eaf1fb;
        font-variant-numeric: tabular-nums;
      }
      #warmup .count.beat { animation: beat 420ms ease-out; }
      /* The whole warm-up, not counting yet: somebody's map is still loading. */
      #warmup .count.held { opacity: 0.45; }
      @keyframes beat { from { transform: scale(1.25); color: #9fe8b4; } to { transform: scale(1); } }
      #warmup .about { font-size: 14px; color: #d7dde6; text-transform: lowercase; }
      #warmup .hint { font-size: 12px; color: var(--dim); }
      #go {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translate(-50%, -50%);
        font-size: 96px;
        font-weight: 800;
        letter-spacing: 0.1em;
        color: #9fe8b4;
        text-shadow: 0 0 24px rgba(159, 232, 180, 0.6), 0 3px 10px rgba(0, 0, 0, 0.9);
        opacity: 0;
        pointer-events: none;
      }
      #go.show { animation: go 1100ms ease-out forwards; }
      @keyframes go {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
        15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        70% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.96); }
      }

      /* ---- matchmaking: searching, found, loading ----------------------- */
      #matchmaking {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(6, 9, 13, 0.72);
        backdrop-filter: blur(3px);
      }
      .mm-card {
        width: min(100%, 460px);
        display: grid;
        gap: 10px;
        padding: 26px 26px 22px;
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(22, 30, 42, 0.96), rgba(12, 16, 22, 0.96));
        border: 1px solid rgba(190, 210, 240, 0.18);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        text-align: center;
      }
      .mm-card[data-phase='found'],
      .mm-card[data-phase='loading'] {
        border-color: rgba(159, 232, 180, 0.55);
        box-shadow: 0 0 0 1px rgba(159, 232, 180, 0.2), 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      .mm-head { display: flex; justify-content: center; align-items: baseline; gap: 14px; }
      .mm-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .mm-card[data-phase='found'] .mm-title,
      .mm-card[data-phase='loading'] .mm-title { color: #9fe8b4; }
      .mm-clock { font-size: 20px; color: var(--dim); font-variant-numeric: tabular-nums; }
      .mm-table { font-size: 16px; color: #d7dde6; }
      .mm-table b { text-transform: capitalize; color: #eaf1fb; }
      .mm-bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(190, 210, 240, 0.1);
        overflow: hidden;
      }
      .mm-bar .fill {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #5fae78, #9fe8b4);
        transform-origin: left center;
        transition: transform 300ms ease;
      }
      .mm-card[data-phase='loading'] .mm-bar .fill { animation: loading 1.1s ease-in-out infinite; }
      @keyframes loading { 0% { opacity: 0.35; } 50% { opacity: 1; } 100% { opacity: 0.35; } }
      .mm-seats { font-size: 12px; color: var(--dim); min-height: 1em; }
      .mm-status { font-size: 14px; color: var(--ink); }
      .mm-fine { font-size: 11px; color: var(--dim); }
      .mm-download { font-size: 11px; color: var(--dim); min-height: 1em; font-variant-numeric: tabular-nums; }
      .mm-card[data-fetching='yes'] .mm-bar .fill { animation: none; }
      .mm-leave {
        justify-self: center;
        margin-top: 6px;
        font: inherit;
        font-size: 13px;
        padding: 8px 18px;
        border-radius: 8px;
        color: #ffd9d4;
        background: rgba(255, 107, 94, 0.12);
        border: 1px solid rgba(255, 107, 94, 0.4);
        cursor: pointer;
      }
      .mm-leave:hover { background: rgba(255, 107, 94, 0.22); }
      /* A sweep going round, the universal sign that something is being
         looked for. Only while searching. */
      .mm-radar {
        position: relative;
        justify-self: center;
        width: 64px;
        height: 64px;
        margin-bottom: 4px;
      }
      .mm-radar span {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(159, 232, 180, 0.35);
        animation: ping 2.4s ease-out infinite;
      }
      .mm-radar span:nth-child(2) { animation-delay: 0.8s; }
      .mm-radar span:nth-child(3) { animation-delay: 1.6s; }
      .mm-radar i {
        position: absolute;
        inset: 27px;
        border-radius: 50%;
        background: #9fe8b4;
        box-shadow: 0 0 14px rgba(159, 232, 180, 0.9);
      }
      @keyframes ping { from { transform: scale(0.2); opacity: 1; } to { transform: scale(1); opacity: 0; } }
      .mm-card[data-phase='found'] .mm-radar span,
      .mm-card[data-phase='loading'] .mm-radar span { animation: none; opacity: 0; }
      .mm-card[data-phase='found'] .mm-radar i { inset: 18px; transition: inset 200ms ease; }

      #crosshair,
      #hitmarker {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      /* Four short lines round a gap and a dot in it, the way modern
         shooters draw one: black, as Conrad asked, with a thin light edge
         so it still shows against a dark wall. The box itself has no size,
         so its corner is the middle of the screen and every part is placed
         from there. */
      #crosshair {
        width: 0;
        height: 0;
        transform: none;
      }
      #crosshair i,
      #crosshair b {
        position: absolute;
        background: rgba(0, 0, 0, 0.92);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.45);
      }
      #crosshair .n { left: -1px; top: -12px; width: 2px; height: 8px; }
      #crosshair .s { left: -1px; top: 4px; width: 2px; height: 8px; }
      #crosshair .w { left: -12px; top: -1px; width: 8px; height: 2px; }
      #crosshair .e { left: 4px; top: -1px; width: 8px; height: 2px; }
      #crosshair b { left: -1px; top: -1px; width: 2px; height: 2px; }

      /* Four strokes forming an X, drawn only when a shot connects. */
      #hitmarker {
        width: 22px;
        height: 22px;
        opacity: 0;
        transition: opacity 60ms linear;
        background:
          linear-gradient(to bottom right, transparent 44%, var(--bad) 44%, var(--bad) 56%, transparent 56%),
          linear-gradient(to bottom left, transparent 44%, var(--bad) 44%, var(--bad) 56%, transparent 56%);
      }
      #hitmarker.show { opacity: 1; }
      /* A headshot is worth twice a body shot, so it gets its own colour
         rather than the same X twice. */
      #hitmarker.head {
        background:
          linear-gradient(to bottom right, transparent 40%, var(--good, #8fe388) 40%, var(--good, #8fe388) 60%, transparent 60%),
          linear-gradient(to bottom left, transparent 40%, var(--good, #8fe388) 40%, var(--good, #8fe388) 60%, transparent 60%);
        width: 28px;
        height: 28px;
      }

      /* ---- a kill paying ------------------------------------------------ */
      /* Under the crosshair, not on it: the next fight may already be in
         front of the player. Money green, as the counter it flies to is. */
      #payouts {
        position: absolute;
        left: 50%;
        top: calc(50% + 58px);
        width: 0;
        height: 0;
      }
      .payout {
        position: absolute;
        left: 0;
        top: 0;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .payout .amount {
        font-size: 44px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        color: #b8f5c8;
        background: linear-gradient(180deg, #f6fff8 0%, #a9f0bf 48%, #45b872 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 12px rgba(120, 230, 160, 0.55)) drop-shadow(0 3px 3px rgba(0, 0, 0, 0.85));
      }
      .payout .amount.unpaid {
        font-size: 30px;
        letter-spacing: 0.14em;
        background: linear-gradient(180deg, #ffffff 0%, #dfe7f2 60%, #9fb0c6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.85));
      }
      .payout .details {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .payout .tags { display: flex; gap: 6px; }
      .payout .tag {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        padding: 3px 7px 3px 9px;
        border-radius: 4px;
        background: rgba(10, 14, 20, 0.74);
        border: 1px solid rgba(159, 232, 180, 0.35);
        color: #d8ffe2;
      }
      .payout .tag.head { border-color: rgba(255, 196, 92, 0.75); color: #ffd88a; }
      .payout .tag.streak { border-color: rgba(255, 107, 94, 0.75); color: #ffb3aa; }
      .payout .victim {
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--dim);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .payout .victim b { color: var(--ink); font-weight: 600; }
      .payout .spark {
        position: absolute;
        left: 50%;
        width: 14px;
        height: 3px;
        margin: -1.5px 0 0 -7px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(255, 246, 208, 0), #fff6d0 60%, #ffffff);
        box-shadow: 0 0 7px 1px rgba(159, 232, 180, 0.9);
      }

      /* Under the pot, which is the other number that belongs to the match
         rather than to the player. */
      #matchclock {
        position: absolute;
        left: 50%;
        top: 58px;
        transform: translateX(-50%);
        font-size: 19px;
        letter-spacing: 0.06em;
        color: var(--ink);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      }
      #matchclock.urgent { color: var(--bad); }

      /* Bottom right above the weapon, reading upwards from newest. A feed
         that grows downwards moves every line every time one arrives, which
         is the one thing a player glancing at it cannot follow. */
      #killfeed {
        position: absolute;
        right: 14px;
        bottom: 96px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        font-size: 13px;
        pointer-events: none;
      }
      #killfeed .kill {
        padding: 4px 9px;
        border-radius: 6px;
        background: rgba(10, 14, 20, 0.72);
        border: 1px solid rgba(190, 210, 240, 0.12);
        color: var(--dim);
        white-space: nowrap;
      }
      /* Anything the player was part of. Their own kills and deaths are the
         only lines worth breaking a glance for. */
      #killfeed .kill.mine {
        border-color: rgba(255, 107, 94, 0.5);
        color: var(--ink);
      }
      #killfeed .who { color: var(--ink); }
      #killfeed .hs { margin: 0 7px; color: var(--bad); }

      #scoreboard {
        position: absolute;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        padding: 12px 16px;
        border-radius: 10px;
        background: rgba(10, 14, 20, 0.88);
        border: 1px solid rgba(190, 210, 240, 0.18);
        font-size: 13px;
        color: var(--dim);
        min-width: min(88vw, 470px);
      }
      #scoreboard table { width: 100%; border-collapse: collapse; }
      #scoreboard th,
      #scoreboard td {
        padding: 3px 8px;
        text-align: right;
        font-weight: 400;
      }
      #scoreboard th { color: var(--dim); opacity: 0.7; font-size: 11px; }
      #scoreboard .name { text-align: left; color: var(--ink); }
      #scoreboard tr.me .name { color: var(--good, #8fe388); }
      #scoreboard tbody tr.me td { color: var(--ink); }

      #lock-hint {
        position: absolute;
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        padding: 9px 16px;
        border-radius: 999px;
        background: rgba(10, 14, 20, 0.78);
        border: 1px solid rgba(190, 210, 240, 0.16);
        font-size: 13px;
        color: var(--ink);
        white-space: nowrap;
      }

      #banner {
        position: absolute;
        left: 50%;
        top: 16%;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 8px;
        background: rgba(60, 16, 16, 0.86);
        border: 1px solid rgba(255, 107, 94, 0.45);
        color: var(--bad);
        font-size: 14px;
        max-width: min(90vw, 620px);
        text-align: center;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        text-align: center;
        background: var(--bg);
        transition: opacity 240ms ease;
      }
      body.running #boot { opacity: 0; pointer-events: none; }

      #boot h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: 0.34em;
        font-weight: 600;
      }
      #boot-status { color: var(--dim); font-size: 13px; min-height: 1.2em; }
      #boot-status.error { color: var(--bad); max-width: 560px; }

      /* ---- the menu ---------------------------------------------------
         The screen before the game. There is no world behind it: until a
         match starts the client has not loaded a map, because which map it
         loads is whichever table the player picks. */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        overflow: auto;
        background:
          radial-gradient(120% 90% at 50% -20%, #16202e 0%, rgba(11, 14, 19, 0) 70%),
          var(--bg);
        display: grid;
        place-items: start center;
        padding: 40px 16px;
      }
      body.in-menu #solatel-canvas { visibility: hidden; }

      /* A life ending: see death.js. The colour drains out of the world, the
         HUD goes, and a card says what happened. */
      #solatel-canvas { transition: filter 0.9s ease-out; }
      body.dying #solatel-canvas { filter: saturate(0.18) contrast(1.12) brightness(0.82); }
      body.dying #hud { visibility: hidden; }
      #death-card {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease-out;
        z-index: 40;
      }
      body.dying #death-card { opacity: 1; }
      #death-card .dc-veil {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 55%, rgba(0, 0, 0, 0) 35%, rgba(90, 6, 6, 0.55) 100%);
        animation: dc-pulse 0.9s ease-out 1;
      }
      @keyframes dc-pulse {
        0% { background-color: rgba(150, 10, 10, 0.45); }
        100% { background-color: rgba(150, 10, 10, 0); }
      }
      #death-card .dc-body {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18%;
        text-align: center;
        color: #f1ece4;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        transform: translateY(14px);
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.35s;
      }
      body.dying #death-card .dc-body { transform: none; }
      #death-card .dc-title {
        font-size: clamp(28px, 6vw, 56px);
        font-weight: 800;
        letter-spacing: 0.32em;
        color: #e8463c;
      }
      #death-card .dc-by { font-size: clamp(18px, 3vw, 26px); margin-top: 6px; font-weight: 700; }
      #death-card .dc-how { font-size: 15px; opacity: 0.85; margin-top: 4px; letter-spacing: 0.08em; }
      #death-card .dc-money { font-size: 14px; opacity: 0.85; margin-top: 14px; }
      #death-card .dc-skip { font-size: 12px; opacity: 0; margin-top: 18px; transition: opacity 0.4s; letter-spacing: 0.12em; }
      #death-card.dc-skippable .dc-skip { opacity: 0.6; }

      .menu-shell {
        width: min(100%, 820px);
        display: grid;
        gap: 18px;
        align-content: start;
      }

      .menu-shell header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }
      .menu-shell .brand {
        font-size: 26px;
        letter-spacing: 0.34em;
        font-weight: 600;
      }
      #purse { display: flex; align-items: baseline; gap: 8px; }
      #purse .amount { font-size: 20px; font-weight: 600; color: #9fe8b4; }
      #purse .caption {
        font-size: 11px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 1.2px;
      }

      #menu-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
      #menu-tabs button {
        font: inherit;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 8px;
        color: var(--dim);
        background: rgba(190, 210, 240, 0.06);
        border: 1px solid rgba(190, 210, 240, 0.14);
        cursor: pointer;
        text-transform: lowercase;
      }
      #menu-tabs button:hover { color: #eaf1fb; }
      #menu-tabs button.on {
        color: #06210f;
        background: #9fe8b4;
        border-color: rgba(255, 255, 255, 0.3);
      }

      .pane {
        display: grid;
        gap: 10px;
        padding: 20px;
        border-radius: 12px;
        background: rgba(10, 14, 20, 0.7);
        border: 1px solid rgba(190, 210, 240, 0.14);
      }
      .pane .label {
        font-size: 11px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 1.3px;
      }
      .pane .big { font-size: 34px; font-weight: 600; color: #9fe8b4; }

      #menu-result {
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(60, 16, 16, 0.5);
        border: 1px solid rgba(255, 107, 94, 0.35);
        font-size: 14px;
        color: var(--ink);
      }
      #menu-result .who { color: var(--bad); }

      /* Maps and tables are the same shape of card: a big name, what it is
         worth, and how busy it is. */
      #menu-maps,
      #menu-tables {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 8px;
      }
      .map,
      .table {
        display: grid;
        gap: 4px;
        font: inherit;
        text-align: center;
        padding: 14px 10px;
        border-radius: 10px;
        color: var(--ink);
        background: rgba(190, 210, 240, 0.06);
        border: 1px solid rgba(190, 210, 240, 0.16);
        cursor: pointer;
      }
      .map:hover,
      .table:hover {
        background: rgba(159, 232, 180, 0.14);
        border-color: rgba(159, 232, 180, 0.45);
      }
      .map.on {
        background: rgba(120, 170, 255, 0.18);
        border-color: rgba(120, 170, 255, 0.55);
      }
      .map .name { font-size: 19px; font-weight: 600; text-transform: capitalize; }
      .map .seats { font-size: 12px; color: var(--ink); }
      .table .stake { font-size: 24px; font-weight: 600; color: #9fe8b4; }
      .table .pays { font-size: 12px; }
      .map .busy,
      .table .busy { font-size: 11px; color: var(--dim); }
      .map .blurb { font-size: 11px; color: var(--dim); }
      .table .caption {
        font-size: 10px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 1.2px;
      }
      .table:hover .stake { color: #c3f5d0; }

      .menu-shell .tagline {
        margin-top: 6px;
        font-size: 11px;
        color: var(--dim);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      /* The rules, stated before anybody pays. */
      .rules {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 8px;
      }
      .rules > div {
        display: grid;
        gap: 4px;
        align-content: start;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(190, 210, 240, 0.04);
        border: 1px solid rgba(190, 210, 240, 0.1);
        font-size: 12px;
        color: var(--dim);
        line-height: 1.45;
      }
      .rules b { color: var(--ink); font-size: 13px; }

      .keys { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--dim); }
      .keys span { display: inline-flex; align-items: center; gap: 4px; }
      kbd {
        font: inherit;
        font-size: 11px;
        color: var(--ink);
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(190, 210, 240, 0.08);
        border: 1px solid rgba(190, 210, 240, 0.22);
        border-bottom-width: 2px;
      }

      /* Mouse against touchpad, said plainly: a touchpad player is at a real
         disadvantage in a game that pays for aim. */
      .devices {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px;
      }
      .device {
        display: grid;
        gap: 5px;
        align-content: start;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(190, 210, 240, 0.12);
        background: rgba(190, 210, 240, 0.04);
        font-size: 12px;
        line-height: 1.45;
        color: var(--dim);
      }
      .device.best { border-color: rgba(159, 232, 180, 0.4); background: rgba(159, 232, 180, 0.06); }
      .device > b { color: var(--ink); font-size: 13px; }
      .device em {
        font-style: normal;
        font-size: 10px;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 4px;
        color: #06210f;
        background: #9fe8b4;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .device .pro::before { content: '+ '; color: #9fe8b4; }
      .device .con::before { content: '\2212  '; color: var(--bad); }
      .device .con b { color: var(--ink); }

      /* Nothing here works on a phone, and it is kinder to say so. */
      .needs-keyboard {
        display: none;
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        color: #ffd28a;
        background: rgba(255, 196, 80, 0.08);
        border: 1px solid rgba(255, 196, 80, 0.3);
      }
      @media (hover: none) and (pointer: coarse) {
        .needs-keyboard { display: block; }
      }

      /* Form controls in the menu's colours rather than the browser's. */
      #menu input[type='range'],
      #menu input[type='checkbox'] { accent-color: #9fe8b4; }
      #menu-profile input[type='text'] {
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(190, 210, 240, 0.2);
        border-radius: 6px;
        padding: 6px 8px;
      }
      #menu-status:empty { display: none; }

      /* ---- the wallet and the account -------------------------------- */
      #wallet-note { font-size: 13px; color: var(--dim); min-height: 1.3em; }
      #wallet-note.warn { color: var(--bad); }
      #wallet-note a { color: #9fe8b4; }
      #wallet-on { display: grid; gap: 14px; }
      #wallet-network {
        font-size: 12px;
        color: var(--dim);
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255, 196, 80, 0.08);
        border: 1px solid rgba(255, 196, 80, 0.3);
      }
      #wallet-network b { color: #ffc450; text-transform: uppercase; letter-spacing: 1px; }
      .wallet-block {
        display: grid;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid rgba(190, 210, 240, 0.1);
        min-width: 0;
      }
      .wallet-block .field {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .wallet-block .field > span { color: var(--dim); }
      .wallet-block code {
        font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
        color: var(--ink);
        background: rgba(190, 210, 240, 0.06);
        border-radius: 6px;
        padding: 6px 8px;
        overflow-wrap: anywhere;
        min-width: 0;
      }
      .wallet-block code.block { display: block; }
      .wallet-block code.secret { color: var(--dim); font-style: italic; }
      .wallet-block .fine { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.5; }
      .wallet-block .fine b { color: var(--ink); }
      .wallet-block a { color: #9fe8b4; }
      .wallet-block button,
      #menu-status #play-here {
        font: inherit;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--ink);
        background: rgba(190, 210, 240, 0.08);
        border: 1px solid rgba(190, 210, 240, 0.2);
        cursor: pointer;
      }
      .wallet-block button:hover { border-color: rgba(159, 232, 180, 0.5); }
      .wallet-block button[type='submit'] {
        justify-self: start;
        font-size: 14px;
        padding: 10px 20px;
        color: #06210f;
        background: #9fe8b4;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .wallet-block button:disabled,
      .wallet-block input:disabled { opacity: 0.45; cursor: not-allowed; }
      #withdraw-form { display: grid; gap: 10px; }
      #withdraw-form label,
      form.inline {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--dim);
      }
      #withdraw-form label { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; }
      .wallet-block input {
        font: 13px ui-monospace, SFMono-Regular, Consolas, monospace;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(190, 210, 240, 0.2);
        border-radius: 6px;
        padding: 8px 10px;
        min-width: 0;
      }
      form.inline input { flex: 1 1 240px; }
      .with-unit { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .with-unit input { flex: 1; }
      /* A Solana Pay code, on white: a scanner wants the quiet zone. */
      .qr {
        justify-self: start;
        width: 148px;
        height: 148px;
        padding: 6px;
        border-radius: 8px;
        background: #ffffff;
      }
      .qr svg { display: block; width: 100%; height: 100%; }
      #solana-wallets { display: flex; flex-wrap: wrap; gap: 8px; }
      .assets { display: flex; gap: 6px; }
      .assets button.on { color: #06210f; background: #9fe8b4; border-color: rgba(255, 255, 255, 0.3); }
      #solana-connected { display: grid; gap: 8px; }
      .wallet-choice {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .wallet-choice img { width: 20px; height: 20px; border-radius: 4px; }
      @media (max-width: 560px) {
        .qr { justify-self: center; }
      }
      #wallet-history { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
      #wallet-history .in b { color: #9fe8b4; }
      #wallet-history .out.returned b { color: var(--bad); }
      #wallet-history .dim { color: var(--dim); }
      @media (max-width: 560px) {
        .wallet-block .field,
        #withdraw-form label { grid-template-columns: minmax(0, 1fr) auto; }
        .wallet-block .field > span,
        #withdraw-form label { grid-column: 1 / -1; }
      }

      /* ---- fair play: the payout record, the rules, the credits -------- */
      .notice {
        font-size: 12px;
        line-height: 1.5;
        color: var(--dim);
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255, 196, 80, 0.08);
        border: 1px solid rgba(255, 196, 80, 0.3);
      }
      .notice b { color: #ffc450; text-transform: uppercase; letter-spacing: 1px; }
      .figures {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 8px;
      }
      .figures > .dim { font-size: 13px; color: var(--dim); }
      .figure {
        display: grid;
        gap: 3px;
        align-content: start;
        padding: 12px 14px;
        border-radius: 8px;
        background: rgba(159, 232, 180, 0.05);
        border: 1px solid rgba(159, 232, 180, 0.22);
        min-width: 0;
      }
      .figure b {
        font-size: 24px;
        font-weight: 600;
        color: #9fe8b4;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .figure .caption {
        font-size: 11px;
        color: var(--ink);
        text-transform: uppercase;
        letter-spacing: 1.2px;
      }
      .figure .detail { font-size: 12px; color: var(--dim); }
      .rules.wide { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      @media (max-width: 560px) {
        .figures { grid-template-columns: 1fr 1fr; }
        .figure { padding: 10px; }
        .figure b { font-size: 19px; }
      }
      #proof-asof { margin: 0; font-size: 12px; color: var(--dim); }
      ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
      ul.plain .dim, ul.plain .dim a { color: var(--dim); }
      #proof-withdrawals b { color: #9fe8b4; }
      #proof-withdrawals a { color: #9fe8b4; }
      ul.honest li,
      ul.credits li {
        font-size: 12px;
        line-height: 1.5;
        color: var(--dim);
        padding-left: 14px;
        position: relative;
      }
      ul.honest li::before,
      ul.credits li::before { content: '\2022'; position: absolute; left: 2px; color: rgba(190, 210, 240, 0.4); }
      ul.credits a { color: var(--ink); }

      #menu-status {
        font-size: 13px;
        color: var(--dim);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      #menu-status b { color: var(--ink); font-weight: 600; }
      #menu-status .warn { color: var(--bad); }
      #menu-status #leave-queue {
        font: inherit;
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 6px;
        color: var(--dim);
        background: rgba(190, 210, 240, 0.08);
        border: 1px solid rgba(190, 210, 240, 0.18);
        cursor: pointer;
      }
      #menu-status #leave-queue:hover { color: #eaf1fb; }

      /* The settings live in the menu now, so they are a plain block rather
         than a panel floating over the weapon. */
      #menu-profile label,
      #settings label {
        display: grid;
        grid-template-columns: 120px 140px 1fr;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--dim);
        padding: 4px 0;
      }
      #settings label.check input { width: auto; justify-self: start; }
      #settings select {
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(190, 210, 240, 0.2);
        border-radius: 6px;
        padding: 5px 8px;
      }
      #settings .settings-note { margin: 2px 0 0; font-size: 12px; line-height: 1.5; color: var(--dim); max-width: 60ch; }
      #menu-profile input[type='text'] { width: 140px; }

      .hidden { display: none !important; }

      /* Anything that describes a match, while the player is not in one. */
      .out-of-match { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="solatel-canvas"></canvas>
    <div id="hud"></div>
    <div id="menu" class="hidden"></div>
    <div id="matchmaking" class="hidden"></div>

    <div id="boot">
      <h1>SOLATEL</h1>
      <div id="boot-status">starting&hellip;</div>
    </div>

    <script type="module" src="solatel.js"></script>
  </body>
</html>
